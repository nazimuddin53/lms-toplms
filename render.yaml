# Render Blueprint – one-click deploy for toplms
# https://render.com/docs/blueprint-spec

databases:
  - name: toplms-db
    plan: free
    databaseName: toplms_db
    user: toplms

services:
  - type: web
    name: toplms
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: toplms-db
          property: connectionURI
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: toplms-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: toplms-db
          property: password
      - key: APP_BASE_URL
        value: https://toplms.onrender.com
