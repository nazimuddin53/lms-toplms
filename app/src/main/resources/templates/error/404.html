<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
    <style>
        .not-found-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.25rem;
        }
        .not-found-code {
            font-family: 'Plus Jakarta Sans', 'Geist', sans-serif;
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .not-found-path {
            font-family: monospace;
            background: var(--color-mint-light);
            border: 1px solid var(--color-mint-border);
            border-radius: var(--radius-sm);
            padding: 0.2rem 0.6rem;
            font-size: 0.85rem;
            color: var(--color-primary-dark);
        }
    </style>
</head>
<body>

<div class="not-found-screen">
    <div style="max-width: 480px;">
        <div class="pill-badge" style="margin-bottom: 1.5rem;">
            <span class="pulse-dot"></span>
            <span>Error 404</span>
        </div>
        <h1 class="not-found-code gradient-text">404</h1>
        <h2 style="margin-bottom: 0.85rem;">This page doesn't exist</h2>
        <p style="color: var(--color-text-muted); margin-bottom: 1.75rem;">
            We couldn't find <span class="not-found-path" th:if="${path != null}" th:text="${path}">the page</span>
            <span th:if="${path == null}">that page</span>. It may have been moved, or the link may be incorrect.
        </p>
        <div class="hero-actions" style="justify-content: center;">
            <a class="btn btn-primary btn-lg" th:href="@{/}">Go home</a>
        </div>
    </div>
</div>

</body>
</html>
