<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dashboard}">

<head>
    <title>Client Workspaces</title>
</head>

<body>

<div layout:fragment="superadminContent" class="space-y-6">

    <div>
        <h1 class="text-2xl font-bold text-slate-900">Client Workspaces</h1>
        <p class="mt-1 text-sm text-slate-500">Every tenant provisioned on the platform.</p>
    </div>

    <div class="overflow-hidden rounded-xl border border-[#e2ebe6] bg-white shadow-sm">
        <table class="min-w-full divide-y divide-[#e2ebe6]">
            <thead class="bg-[#f3faf5]">
            <tr>
                <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">Workspace</th>
                <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">Subdomain</th>
                <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">Plan</th>
                <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">Users</th>
                <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">Courses</th>
                <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">Status</th>
                <th class="px-6 py-4 text-right text-xs font-semibold uppercase text-slate-500">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-[#e2ebe6]">
            <tr th:each="item : ${tenantSummaries}" class="hover:bg-[#f7faf8]">
                <td class="px-6 py-4">
                    <p class="text-sm font-semibold text-slate-800" th:text="${item.tenant().companyName}">Acme Academy</p>
                    <p class="text-xs text-slate-400" th:text="${item.tenant().name}">Acme</p>
                </td>
                <td class="px-6 py-4 text-sm text-slate-500 font-mono" th:text="${item.tenant().subdomain}">demo</td>
                <td class="px-6 py-4 text-sm text-slate-600" th:text="${item.tenant().plan?.name ?: item.tenant().plan?.id}">GROWTH</td>
                <td class="px-6 py-4 text-sm text-slate-600" th:text="${item.userCount()}">0</td>
                <td class="px-6 py-4 text-sm text-slate-600" th:text="${item.courseCount()}">0</td>
                <td class="px-6 py-4">
                    <span th:if="${item.tenant().active}" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 border border-emerald-200">
                        <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Active
                    </span>
                    <span th:unless="${item.tenant().active}" class="inline-flex items-center gap-1.5 rounded-full bg-rose-50 px-2.5 py-0.5 text-xs font-semibold text-rose-700 border border-rose-200">
                        <span class="h-1.5 w-1.5 rounded-full bg-rose-500"></span> Suspended
                    </span>
                </td>
                <td class="px-6 py-4 text-right">
                    <a th:href="@{/superadmin/tenants/{id}(id=${item.tenant().id})}"
                       class="rounded-lg bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700 hover:bg-emerald-100 border border-emerald-200">
                        View
                    </a>
                </td>
            </tr>

            <tr th:if="${tenantSummaries == null or #lists.isEmpty(tenantSummaries)}">
                <td colspan="7" class="px-6 py-12 text-center text-slate-400">No tenants have signed up yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
