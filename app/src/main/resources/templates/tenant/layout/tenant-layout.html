<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <!-- layout:title-pattern merges the base title with individual page titles -->
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE"></title>
    <!-- Tailwind output: generated by the `tailwindBuild` Gradle task from
         src/main/tailwind/app.css into build/resources/main/static/css/app.css. -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Shared Navigation Header Bar -->
<!-- ===== Navigation ===== -->
<header class="nav">
    <div class="container nav-inner">
        <a class="brand" th:href="@{/}">
            <span class="mark" th:text="${#strings.toUpperCase(#strings.substring(appName ?: 'Tenant', 0, 1))}">T</span>
            <span th:text="${appName ?: 'Tenant'}">Tenant</span>
        </a>
        <nav class="nav-links">
            <a class="link" href="#features">Course</a>
            <a class="link" href="#how">About Us</a>
        </nav>
        <div class="nav-actions">
            <a class="btn btn-primary" th:href="@{/signup}">Sign Up</a>
        </div>
    </div>
</header>

<!-- Dynamic Content Placeholder Box -->
<main layout:fragment="tenantContent">
    <!-- Each page's <main layout:fragment="content"> replaces this whole element. -->
</main>

<!-- Shared Global Footer -->

<footer class="footer">
    <div class="container">
        <div class="footer-grid">
            <div>
                <a class="brand" th:href="@{/}">
                    <span class="mark" th:text="${#strings.toUpperCase(#strings.substring(appName ?: 'Tenant', 0, 1))}">T</span>
                    <span th:text="${appName ?: 'Tenant'}">Tenant</span>
                </a>
                <p class="tagline" th:text="${tagline}">Multi-tenant Learning Management System</p>
            </div>
            <div>
                <h4>Product</h4>
                <ul>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#how">How it works</a></li>
                    <li><a href="#pricing">Pricing</a></li>
                </ul>
            </div>
            <div>
                <h4>Company</h4>
                <ul>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; <span th:text="${currentYear ?: '2026'}">2026</span>
            <span th:text="${appName ?: 'Toplms'}">toplms</span> · Built with Spring Boot &amp; Thymeleaf
        </div>
    </div>
</footer>

</body>
</html>
