<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- layout:title-pattern merges the base title with individual page titles -->
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE"></title>
    <!-- Tailwind output: generated by the `tailwindBuild` Gradle task from
         src/main/tailwind/app.css into build/resources/main/static/css/app.css. -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Shared Navigation Header Bar -->
<header class="nav-wrapper">
    <div class="container">
        <nav class="nav-pill" aria-label="Main Navigation">
            <a class="brand" th:href="@{/}">
                <img class="brand-logo" th:src="@{/images/TopLMS-Logo.png}" alt="TopLMS logo">
            </a>

            <div class="nav-links" id="navLinks">
                <a class="nav-link" th:href="@{/#courses}">Courses</a>
                <a class="nav-link" th:href="@{/#about}">About Us</a>
            </div>

            <div class="nav-actions">
                <a class="nav-login-link" th:href="@{/login}">Sign In</a>
                <a class="btn btn-nav-cta" th:href="@{/signup}">Sign Up</a>
                <button class="nav-mobile-toggle" id="navToggle" aria-label="Toggle navigation menu" type="button">
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
    </div>
</header>

<!-- Dynamic Content Placeholder Box -->
<main layout:fragment="tenantContent">
    <!-- Each page's <main layout:fragment="content"> replaces this whole element. -->
</main>

<!-- Shared Global Footer -->

<footer class="footer">
    <div class="container">
        <div class="footer-grid">
            <div class="footer-brand-col">
                <a class="brand" th:href="@{/}">
                    <img class="brand-logo" th:src="@{/images/TopLMS-Logo.png}" alt="TopLMS logo">
                </a>
                <p class="footer-tagline" th:text="${tagline}">Multi-tenant Learning Management System</p>
            </div>
            <div class="footer-col">
                <h4>Learn</h4>
                <ul>
                    <li><a href="#courses">Courses</a></li>
                    <li><a href="#about">About Us</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Account</h4>
                <ul>
                    <li><a th:href="@{/login}">Sign In</a></li>
                    <li><a th:href="@{/signup}">Sign Up</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <div class="footer-bottom-inner">
                <p>&copy; <span th:text="${currentYear ?: '2026'}">2026</span>
                    <span th:text="${appName ?: 'Toplms'}">toplms</span></p>
                <p class="footer-tech">Built with <span>Spring Boot</span> &amp; <span>Thymeleaf</span></p>
            </div>
        </div>
    </div>
</footer>

<script>
    // Mobile navigation menu toggle — mirrors layout/layout.html's version.
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    if (navToggle && navLinks) {
        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('nav-links-open');
            navToggle.classList.toggle('active');
        });
    }
</script>

</body>
</html>
