<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Workspace Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

<div class="flex min-h-screen">

  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col fixed inset-y-0 left-0 z-20 shadow-xl border-r border-slate-800">
    <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
      <span class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm tracking-wide shadow-md"
            th:text="${#strings.toUpperCase(#strings.substring(currentTenant?.companyName ?: 'T', 0, 1))}">T</span>
      <span class="ml-3 font-semibold text-white tracking-tight truncate text-sm"
            th:text="${currentTenant?.companyName ?: 'Workspace Dashboard'}">Workspace Dashboard</span>
    </div>

    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">

      <a th:href="@{/dashboard}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-indigo-600 text-white transition-colors duration-200">
        <svg class="w-5 h-5 mr-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Overview Dashboard
      </a>

      <th:block th:if="${sidebarMenus != null}">
        <a th:each="menuItem : ${sidebarMenus}"
           th:href="@{{path}(path=${menuItem.value})}"
           class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200 group">

          <svg class="w-4 h-4 mr-3 text-slate-500 group-hover:text-indigo-400 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
          </svg>

          <span th:text="${menuItem.key}">Dynamic Link Title</span>
        </a>
      </th:block>

      <th:block th:if="${sidebarMenus == null}">
        <span class="px-4 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider block pt-2">Default Menu</span>
        <a th:href="@{/dashboard/courses}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          Manage Courses
        </a>
        <a th:href="@{/dashboard/users}" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-all duration-200">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          Student Roster
        </a>
      </th:block>

    </nav>

    <div class="p-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between">
      <div class="truncate mr-2">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Subdomain ID</p>
        <p class="text-sm font-medium text-white truncate" th:text="${currentTenant?.subdomain + '.toplms.com'}">tenant.toplms.com</p>
      </div>
      <a th:href="@{/logout}" class="p-1.5 rounded-md hover:bg-slate-800 text-slate-400 hover:text-rose-400 transition-colors" title="Sign Out">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </a>
    </div>
  </aside>

  <div class="flex-1 pl-64 flex flex-col min-h-screen">

    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10 shadow-sm">
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 border border-green-200">
          SaaS Client Node
        </span>
      </div>
      <div class="flex items-center space-x-4">
        <div class="text-right">
          <p class="text-sm font-semibold text-slate-700" th:text="${user?.name}">Workspace User</p>
          <p class="text-xs text-slate-400 font-medium" th:text="${userType ?: 'User Profile'}">User Profile</p>
        </div>
        <div class="h-9 w-9 rounded-full bg-indigo-100 border border-indigo-200 flex items-center justify-center text-indigo-700 font-bold text-sm"
             th:text="${#strings.toUpperCase(#strings.substring(user?.name ?: 'U', 0, 1))}">
          U
        </div>
      </div>
    </header>

    <main class="flex-1 p-8" layout:fragment="dashboardContentTenant">
    </main>

    <footer class="h-12 bg-white border-t border-slate-200 px-8 flex items-center justify-between text-xs text-slate-400 font-medium">
      <div>&copy; 2026 <span th:text="${currentTenant?.companyName}">Tenant Workspace</span>. Powered by TopLMS framework.</div>
      <div class="flex items-center space-x-4">
        <span th:text="${'Plan Tier: ' + (currentTenantPlanId ?: 'FREE')}">Plan Tier: FREE</span>
      </div>
    </footer>
  </div>

</div>

</body>
</html>
