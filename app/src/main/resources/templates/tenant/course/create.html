<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{tenant/layout/dashboard}">

<head>
  <title>Create Course</title>
</head>

<body>

<div layout:fragment="dashboardContentTenant" class="max-w-3xl space-y-6">

  <div>
    <h1 class="text-2xl font-bold text-slate-900">
      Create Course
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Add a new course to your workspace.
    </p>
  </div>


  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">

    <form th:action="@{/dashboard/courses}"
          th:object="${course}"
          method="post"
          class="space-y-6">


      <!-- Title -->
      <div>

        <label class="mb-2 block text-sm font-medium text-slate-700">
          Course Title
        </label>

        <input type="text"
               th:field="*{title}"
               placeholder="Enter course title"
               required
               class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">

      </div>


      <!-- Description -->
      <div>

        <label class="mb-2 block text-sm font-medium text-slate-700">
          Description
        </label>

        <textarea th:field="*{description}"
                  rows="6"
                  placeholder="Enter course description"
                  class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100"></textarea>

      </div>


      <!-- Buttons -->
      <div class="flex items-center justify-end gap-3">

        <a th:href="@{/dashboard/courses}"
           class="rounded-lg border border-slate-300 px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
          Cancel
        </a>

        <button type="submit"
                class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">
          Create Course
        </button>

      </div>

    </form>

  </div>

</div>

</body>
</html>
