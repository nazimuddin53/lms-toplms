<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{tenant/layout/dashboard}">

<head>
  <title>Courses</title>
</head>

<body>

<div layout:fragment="dashboardContentTenant" class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">

    <div>
      <h1 class="text-2xl font-bold text-slate-900">
        Courses
      </h1>

      <p class="mt-1 text-sm text-slate-500">
        Manage your learning courses.
      </p>
    </div>

    <a th:href="@{/dashboard/courses/create}"
       class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">
      + Create Course
    </a>

  </div>


  <!-- Course Table -->
  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">

    <table class="min-w-full divide-y divide-slate-200">

      <thead class="bg-slate-50">

      <tr>
        <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">
          ID
        </th>

        <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">
          Course Title
        </th>

        <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">
          Description
        </th>

        <th class="px-6 py-4 text-left text-xs font-semibold uppercase text-slate-500">
          Created
        </th>

        <th class="px-6 py-4 text-right text-xs font-semibold uppercase text-slate-500">
          Actions
        </th>
      </tr>

      </thead>


      <tbody class="divide-y divide-slate-100">

      <tr th:each="course : ${courses}"
          class="hover:bg-slate-50">

        <td class="px-6 py-4 text-sm text-slate-500"
            th:text="${course.id}">
          1
        </td>

        <td class="px-6 py-4 text-sm font-semibold text-slate-800"
            th:text="${course.title}">
          Java Spring Boot
        </td>

        <td class="px-6 py-4 text-sm text-slate-500"
            th:text="${course.description}">
          Learn Spring Boot
        </td>

        <td class="px-6 py-4 text-sm text-slate-500"
            th:text="${#temporals.format(course.createdAt, 'dd MMM yyyy')}">
          09 Sep 2026
        </td>

        <td class="px-6 py-4 text-right">

          <div class="flex justify-end gap-2">

            <!-- EDIT -->
            <a th:href="@{/dashboard/courses/edit/{id}(id=${course.id})}"
               class="rounded-lg bg-amber-50 px-3 py-2 text-sm font-medium text-amber-700 hover:bg-amber-100">
              Edit
            </a>


            <!-- DELETE -->
            <form th:action="@{/dashboard/courses/delete/{id}(id=${course.id})}"
                  method="post">

              <button type="submit"
                      onclick="return confirm('Are you sure you want to delete this course?')"
                      class="rounded-lg bg-rose-50 px-3 py-2 text-sm font-medium text-rose-700 hover:bg-rose-100">
                Delete
              </button>

            </form>

          </div>

        </td>

      </tr>


      <!-- Empty State -->
      <tr th:if="${courses == null or #lists.isEmpty(courses)}">

        <td colspan="5"
            class="px-6 py-12 text-center text-slate-400">

          No courses found.

          <div class="mt-3">
            <a th:href="@{/dashboard/courses/create}"
               class="font-medium text-indigo-600 hover:text-indigo-700">
              Create your first course
            </a>
          </div>

        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>

</body>
</html>
