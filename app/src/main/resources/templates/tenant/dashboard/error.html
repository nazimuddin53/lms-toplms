<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{tenant/layout/dashboard}">
<head>
    <title th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Page not found</title>
</head>
<body>

<div layout:fragment="dashboardContentTenant" class="flex min-h-[70vh] items-center justify-center p-8">
    <div class="max-w-md text-center">
        <p class="text-6xl font-bold text-indigo-600 mb-4" th:text="${status}">404</p>
        <h1 class="text-2xl font-bold text-slate-900 mb-2"
            th:text="${status == 404} ? 'This page isn\'t built yet' : 'Something went wrong'">
            This page isn't built yet
        </h1>
        <p class="text-slate-500 mb-2" th:if="${status == 404}">
            <span th:if="${path != null}" th:text="${path}">/path</span> doesn't exist — this feature may not be wired up yet.
        </p>
        <p class="text-slate-500 mb-6" th:if="${status != 404}">
            An unexpected error occurred while loading this page. Please try again.
        </p>
        <a th:href="@{/dashboard}"
           class="inline-flex items-center px-5 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors duration-200">
            Back to Dashboard
        </a>
    </div>
</div>

</body>
</html>
