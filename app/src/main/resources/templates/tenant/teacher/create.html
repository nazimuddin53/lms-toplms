<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{tenant/layout/dashboard}">

<head>
  <title>Create Teacher</title>
</head>

<body>

<div layout:fragment="dashboardContentTenant"
     class="space-y-8 p-8">

  <!-- Page Header -->
  <section>

    <p class="text-sm font-medium text-emerald-600">
      Teacher Management
    </p>

    <h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-900">
      Create Teacher
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Add a new teacher to your learning workspace.
    </p>

  </section>


  <!-- Form Section -->
  <section class="max-w-3xl">

    <div class="rounded-xl border border-slate-200 bg-white shadow-sm">


      <!-- Form Header -->
      <div class="border-b border-slate-100 px-6 py-5">

        <div class="flex items-center gap-3">

          <div class="flex h-11 w-11 items-center justify-center rounded-lg bg-emerald-50 text-emerald-600">

            <svg class="h-6 w-6"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">

              <path stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a7 7 0 0114 0">
              </path>

            </svg>

          </div>


          <div>

            <h2 class="text-base font-semibold text-slate-900">
              Teacher Information
            </h2>

            <p class="text-sm text-slate-500">
              Enter the teacher's basic information.
            </p>

          </div>

        </div>

      </div>


      <!-- Form -->
      <form th:action="@{/dashboard/teachers/create}"
            th:object="${teacher}"
            method="post"
            class="space-y-6 p-6">


        <!-- Teacher Name -->
        <div>

          <label for="name"
                 class="mb-2 block text-sm font-medium text-slate-700">

            Teacher Name

          </label>

          <input type="text"
                 id="name"
                 th:field="*{name}"
                 placeholder="Enter teacher name"
                 required
                 class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">

        </div>


        <!-- Email -->
        <div>

          <label for="email"
                 class="mb-2 block text-sm font-medium text-slate-700">

            Email Address

          </label>

          <input type="email"
                 id="email"
                 th:field="*{email}"
                 placeholder="teacher@example.com"
                 required
                 class="block w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">

        </div>


        <!-- Buttons -->
        <div class="flex items-center justify-end gap-3 border-t border-slate-100 pt-6">

          <a th:href="@{/dashboard/teachers}"
             class="rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">

            Cancel

          </a>


          <button type="submit"
                  class="inline-flex items-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700">

            <svg class="mr-2 h-4 w-4"
                 fill="none"
                 stroke="currentColor"
                 viewBox="0 0 24 24">

              <path stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v16m8-8H4">
              </path>

            </svg>

            Create Teacher

          </button>

        </div>

      </form>

    </div>

  </section>


  <!-- Back to Dashboard -->
  <div>

    <a th:href="@{/dashboard}"
       class="inline-flex items-center text-sm font-medium text-indigo-600 transition hover:text-indigo-700">

      <svg class="mr-1 h-4 w-4"
           fill="none"
           stroke="currentColor"
           viewBox="0 0 24 24">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7">
        </path>

      </svg>

      Back to Dashboard

    </a>

  </div>

</div>

</body>
</html>
