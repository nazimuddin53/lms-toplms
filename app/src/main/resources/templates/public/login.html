<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{tenant/layout/tenant-layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <title th:text="${appName} + ' — Multi-tenant LMS for your business'">toplms — Multi-tenant LMS</title>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>
<body>

<main layout:fragment="tenantContent">
    <div class="registration-container">

        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">This domain subdomain name is already taken!</span>
        </div>

        <form th:action="@{/login}" th:object="${signInDto}" method="POST" autocomplete="off" class="text-black">

            <fieldset>
                <legend
                th:text="${userType}">Profile</legend>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="john@company.com" required
                           />
                    <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required
                           />
                    <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>
            </fieldset>

            <button type="submit">
                Sign In
            </button>

            <div class="form-meta">
                Create a new account
                <a th:href="@{/signup}">Sign Up</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
