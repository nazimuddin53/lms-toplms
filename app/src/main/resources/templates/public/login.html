<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Sign In — ' + (${appName} ?: 'TopLMS')">Sign In — TopLMS</title>
</head>
<body>

<main layout:fragment="content">
    <section class="auth-section">
        <div class="hero-ambient-glow" aria-hidden="true"></div>

        <div class="container auth-container">
            <div class="auth-card-wrapper reveal-on-scroll">
                <div class="auth-card">
                    <!-- Brand Header -->
                    <div class="auth-header">
                        <div class="pill-badge auth-badge">
                            <span class="pulse-dot"></span>
                            <span th:text="${userType ?: 'Secure Sign In'}">Academic Portal Sign In</span>
                        </div>
                        <h1 class="auth-title">Welcome <span class="gradient-text">Back</span></h1>
                        <p class="auth-subtitle">Enter your academic credentials to access your portal</p>
                    </div>

                    <!-- Flash / Error Alerts -->
                    <div th:if="${errorMessage}" class="auth-alert auth-alert-danger" role="alert">
                        <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span th:text="${errorMessage}">Invalid email or password. Please try again.</span>
                    </div>

                    <div th:if="${successMessage}" class="auth-alert auth-alert-success" role="alert">
                        <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <span th:text="${successMessage}">Operation completed successfully.</span>
                    </div>

                    <!-- Sign In Form -->
                    <form th:action="@{/login}" th:object="${signInDto}" method="POST" autocomplete="off" class="auth-form">
                        
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input type="email" id="email" th:field="*{email}" placeholder="admin@domain.com" required
                                       class="form-input" th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''" />
                            </div>
                            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                        </div>

                        <div class="form-group">
                            <div class="label-row">
                                <label for="password" class="form-label">Password</label>
                            </div>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required
                                       class="form-input" th:classappend="${#fields.hasErrors('password')} ? 'input-error' : ''" />
                            </div>
                            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg auth-submit-btn">
                            <span>Sign In to Workspace</span>
                            <svg class="icon-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>

                        <div class="auth-footer-meta">
                            <span>Need to create a new institution?</span>
                            <a th:href="@{/signup}" class="auth-link">Launch Your Academy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>

</body>
</html>
